<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端面试题库 (Vue篇) - 一年经验总结</title>
    <!-- 引入 Tailwind CSS 进行快速响应式布局和样式编写 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Vue 3 用于数据驱动视图和折叠逻辑 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        /* 自定义滚动条样式，使其更美观 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        /* 折叠面板平滑过渡动画 */
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-in-out;
        }
        .accordion-content.is-open {
            grid-template-rows: 1fr;
        }
        .accordion-inner {
            overflow: hidden;
        }
        
        /* 返回顶部按钮的淡入淡出动画 */
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
        
        [v-cloak] {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <!-- 修改点：为整个容器增加顶部的内边距，以防止被固定的顶部导航栏遮挡 -->
    <div id="app" v-cloak class="min-h-screen pt-28 md:pt-16 flex">
        
        <!-- 1. 全局顶部冻结栏 (全宽) -->
        <header class="fixed top-0 left-0 right-0 h-16 bg-white shadow-sm z-30 flex items-center justify-between px-4 md:px-6">
            <!-- 左侧: Logo & 标题 -->
            <div class="flex items-center">
                <h1 class="text-xl md:text-2xl font-bold text-emerald-600 truncate">Vue 面试题库</h1>
                <span class="hidden md:inline-block ml-3 px-2 py-0.5 bg-emerald-50 text-emerald-600 text-xs rounded-full border border-emerald-100">一年经验精简版</span>
            </div>
            
            <!-- 右侧: 搜索 & 随机测验功能区 -->
            <div class="flex items-center space-x-2 md:space-x-4">
                <!-- 展开式搜索框 (动态宽度缩放动画) -->
                <div class="relative group">
                    <input 
                        v-model="searchQuery" 
                        @focus="activeCategoryId = 'search'"
                        type="text" 
                        placeholder="搜索题目或答案..." 
                        class="w-36 md:w-56 focus:w-48 md:focus:w-80 transition-all duration-300 pl-10 pr-4 py-2 bg-gray-100 border border-transparent focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 rounded-full text-sm outline-none shadow-sm"
                    >
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5 transition-colors group-focus-within:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                
                <!-- 随机测验按钮 -->
                <button 
                    @click="activeCategoryId = 'random'"
                    :class="['p-2 md:px-4 md:py-2 rounded-full text-sm font-medium transition-colors duration-200 flex items-center', activeCategoryId === 'random' ? 'bg-orange-500 text-white shadow' : 'bg-orange-50 text-orange-600 hover:bg-orange-100']"
                    title="随机10题"
                >
                    <svg class="w-5 h-5 md:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span class="hidden md:inline">随机测验</span>
                </button>
            </div>
        </header>

        <!-- 移动端分类导航 (紧贴在全宽 Header 下方) -->
        <nav class="md:hidden fixed top-16 left-0 right-0 bg-white shadow-sm z-20 flex overflow-x-auto p-2 whitespace-nowrap scrollbar-hide border-t border-gray-100">
            <button 
                v-for="cat in categories" 
                :key="cat.id"
                @click="activeCategoryId = cat.id"
                :class="['px-4 py-1.5 mx-1 rounded-full text-sm font-medium transition-colors duration-200', 
                         activeCategoryId === cat.id ? 'bg-emerald-500 text-white shadow' : 'bg-gray-100 text-gray-600']"
            >
                {{ cat.name }}
            </button>
        </nav>

        <!-- PC端左侧侧边栏 (小屏隐藏，顶部贴齐固定 Header) -->
        <aside class="hidden md:flex flex-col w-64 bg-white shadow-[1px_0_5px_rgba(0,0,0,0.05)] z-10 fixed h-[calc(100vh-4rem)] top-16 left-0">
            <nav class="flex-1 overflow-y-auto p-4 space-y-2">
                <button 
                    v-for="cat in categories" 
                    :key="cat.id"
                    @click="activeCategoryId = cat.id"
                    :class="['w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-between', 
                             activeCategoryId === cat.id ? 'bg-emerald-50 text-emerald-700 border-l-4 border-emerald-500' : 'text-gray-600 hover:bg-gray-50']"
                >
                    <span>{{ cat.name }}</span>
                    <span class="bg-gray-100 text-gray-500 text-xs py-0.5 px-2 rounded-full" v-if="activeCategoryId !== cat.id">{{ cat.questions.length }}</span>
                </button>
            </nav>
            <div class="p-4 border-t text-xs text-gray-400 text-center">
                持续学习，保持热爱
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="flex-1 md:ml-64 p-4 md:p-8">
            <div class="max-w-4xl mx-auto">
                
                <!-- 1. 常规分类展示 -->
                <template v-if="activeCategoryId !== 'search' && activeCategoryId !== 'random'">
                    <div class="mb-8">
                        <h2 class="text-2xl md:text-3xl font-extrabold text-gray-800 border-l-4 border-emerald-500 pl-4">
                            {{ activeCategory.name }}
                        </h2>
                        <p class="text-gray-500 mt-2 pl-4 text-sm md:text-base">点击题目展开查看详细解答。回答以实际项目经验为核心，避免死记硬背。</p>
                    </div>

                    <div class="space-y-4">
                        <div v-for="(item, index) in activeCategory.questions" :key="index" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden transition-all duration-300 hover:shadow-md">
                            <button @click="toggleQuestion(index)" class="w-full px-6 py-4 text-left flex justify-between items-center focus:outline-none">
                                <span class="font-semibold text-gray-800 text-base md:text-lg pr-4 flex-1">
                                    <span class="text-emerald-500 mr-2 opacity-70">Q:</span>
                                    {{ item.q }}
                                </span>
                                <svg :class="['w-5 h-5 text-gray-400 transform transition-transform duration-300 flex-shrink-0', openQuestions.includes(index) ? 'rotate-180 text-emerald-500' : '']" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <div :class="['accordion-content', openQuestions.includes(index) ? 'is-open' : '']">
                                <div class="accordion-inner">
                                    <div class="px-6 pb-5 pt-1 border-t border-gray-50 text-gray-600 leading-relaxed text-sm md:text-base">
                                        <span class="font-bold text-emerald-500 block mb-2">A:</span>
                                        <div v-html="item.a" class="space-y-2"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 列表最下方静态：返回顶部按钮 (题目数量较多时显示) -->
                    <div v-if="activeCategory.questions.length > 3" class="mt-8 pt-6 pb-8 text-center border-t border-gray-100">
                        <button @click="scrollToTop" class="inline-flex items-center justify-center px-6 py-2.5 bg-emerald-50 text-emerald-600 rounded-full hover:bg-emerald-100 transition-colors text-sm font-medium shadow-sm">
                            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                            看完啦，返回顶部
                        </button>
                    </div>
                </template>

                <!-- 2. 全局搜索视图 -->
                <template v-else-if="activeCategoryId === 'search'">
                    <div class="mb-8">
                        <h2 class="text-2xl md:text-3xl font-extrabold text-gray-800 border-l-4 border-indigo-500 pl-4">
                            全局搜索结果
                        </h2>
                        <div class="mt-4 pl-4">
                            <!-- 移除了原有的多余输入框，依靠顶部的搜索框进行驱动 -->
                            <p class="text-sm text-gray-500" v-if="searchQuery">
                                正在搜索关键词 "<span class="font-bold text-indigo-600">{{ searchQuery }}</span>" ，共找到 <span class="font-bold text-indigo-600">{{ searchResults.length }}</span> 道相关题目
                            </p>
                            <p class="text-sm text-gray-500" v-else>
                                👆 请在右上角的搜索框中输入关键词，结果将实时显示在这里。
                            </p>
                        </div>
                    </div>

                    <div v-if="searchResults.length === 0 && searchQuery" class="text-center py-12 text-gray-400">
                        <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        没有找到与 "{{ searchQuery }}" 相关的题目，换个关键词试试？
                    </div>

                    <div class="space-y-4">
                        <div v-for="(item, index) in searchResults" :key="'search-'+index" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden transition-all duration-300 hover:shadow-md">
                            <button @click="toggleQuestion(index)" class="w-full px-6 py-4 text-left flex justify-between items-center focus:outline-none">
                                <div class="flex-1 pr-4">
                                    <span class="inline-block px-2 py-1 bg-indigo-50 text-indigo-600 text-xs rounded mb-2">{{ item.catName }}</span>
                                    <div class="font-semibold text-gray-800 text-base md:text-lg">
                                        <span class="text-emerald-500 mr-2 opacity-70">Q:</span>{{ item.q }}
                                    </div>
                                </div>
                                <svg :class="['w-5 h-5 text-gray-400 transform transition-transform duration-300 flex-shrink-0', openQuestions.includes(index) ? 'rotate-180 text-emerald-500' : '']" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <div :class="['accordion-content', openQuestions.includes(index) ? 'is-open' : '']">
                                <div class="accordion-inner">
                                    <div class="px-6 pb-5 pt-1 border-t border-gray-50 text-gray-600 leading-relaxed text-sm md:text-base">
                                        <span class="font-bold text-emerald-500 block mb-2">A:</span>
                                        <div v-html="item.a" class="space-y-2"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 搜索结果底部：返回顶部按钮 -->
                    <div v-if="searchResults.length > 3" class="mt-8 pt-6 pb-8 text-center border-t border-gray-100">
                        <button @click="scrollToTop" class="inline-flex items-center justify-center px-6 py-2.5 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 transition-colors text-sm font-medium shadow-sm">
                            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                            返回顶部
                        </button>
                    </div>
                </template>

                <!-- 3. 随机抽题视图 -->
                <template v-else-if="activeCategoryId === 'random'">
                    <div class="mb-8 flex flex-col sm:flex-row sm:items-end justify-between border-l-4 border-orange-500 pl-4">
                        <div>
                            <h2 class="text-2xl md:text-3xl font-extrabold text-gray-800">
                                随机测验 (10题)
                            </h2>
                            <p class="text-gray-500 mt-2 text-sm md:text-base">从全库随机抽取，检验自己的知识盲区。</p>
                        </div>
                        <button 
                            @click="generateRandomQuestions" 
                            class="mt-4 sm:mt-0 flex items-center justify-center px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white rounded-lg shadow transition-colors font-medium text-sm"
                        >
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            重新抽取
                        </button>
                    </div>

                    <div class="space-y-4">
                        <div v-for="(item, index) in randomQuestions" :key="'rand-'+index" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden transition-all duration-300 hover:shadow-md">
                            <button @click="toggleQuestion(index)" class="w-full px-6 py-4 text-left flex justify-between items-center focus:outline-none">
                                <div class="flex-1 pr-4">
                                    <span class="inline-block px-2 py-1 bg-orange-50 text-orange-600 text-xs rounded mb-2">{{ item.catName }}</span>
                                    <div class="font-semibold text-gray-800 text-base md:text-lg">
                                        <span class="text-orange-500 mr-2 opacity-80">{{ index + 1 }}.</span>{{ item.q }}
                                    </div>
                                </div>
                                <svg :class="['w-5 h-5 text-gray-400 transform transition-transform duration-300 flex-shrink-0', openQuestions.includes(index) ? 'rotate-180 text-orange-500' : '']" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <div :class="['accordion-content', openQuestions.includes(index) ? 'is-open' : '']">
                                <div class="accordion-inner">
                                    <div class="px-6 pb-5 pt-1 border-t border-gray-50 text-gray-600 leading-relaxed text-sm md:text-base">
                                        <span class="font-bold text-orange-500 block mb-2">A:</span>
                                        <div v-html="item.a" class="space-y-2"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 随机测验底部：返回顶部按钮 (10题通常需要滚动) -->
                    <div v-if="randomQuestions.length > 0" class="mt-8 pt-6 pb-8 text-center border-t border-gray-100">
                        <button @click="scrollToTop" class="inline-flex items-center justify-center px-6 py-2.5 bg-orange-50 text-orange-600 rounded-full hover:bg-orange-100 transition-colors text-sm font-medium shadow-sm">
                            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                            测验完毕，返回顶部
                        </button>
                    </div>
                </template>

            </div>
        </main>

        <!-- 返回最顶部悬浮按钮 -->
        <transition name="fade">
            <button 
                v-if="showBackToTop" 
                @click="scrollToTop"
                class="fixed bottom-6 right-6 md:bottom-10 md:right-10 p-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full shadow-lg hover:shadow-xl focus:outline-none z-50 transition-all duration-300 transform hover:-translate-y-1"
                title="返回最顶部"
            >
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
            </button>
        </transition>

    </div>

    <script>
        const { createApp, ref, computed, watch, onMounted, onUnmounted } = Vue;

        const app = createApp({
            setup() {
                // 定义所有题库数据 (此处为了节省空间，省略具体的 categories 内容，保持您原有的完整数组即可)
                const categories = [
                    {
                        id: 'lifecycle',
                        name: '1. Vue 2 生命周期',
                        questions: [
                            {
                                q: '1.1 生命周期有哪些？发送请求在created还是mounted？',
                                a: '分为创建、挂载、更新、销毁四个阶段，共8个主要钩子（beforeCreate, created, beforeMount, mounted, beforeUpdate, updated, beforeDestroy, destroyed）。<br><br><strong>发送请求一般放在 <code>created</code> 中。</strong>因为此时 <code>data</code> 已经初始化完毕，能尽早发请求减少页面白屏时间；但如果请求的入参严重依赖于某些获取真实 DOM 之后才能确定的状态（比如容器实际渲染的宽度），则会放在 <code>mounted</code> 里进行。'
                            },
                            {
                                q: '1.2 为什么发送请求不在beforeCreated里？beforeCreate和created有什么区别？',
                                a: '因为在 <code>beforeCreate</code> 阶段，Vue 实例仅仅刚初始化了默认事件和生命周期，<strong>数据劫持（如 <code>data</code>、<code>methods</code>、<code>computed</code>）都还没有开始。</strong><br><br>此时如果发异步请求拿到了数据并尝试赋给 <code>this.xxx</code>，会直接报错找不到属性，或者就算强行赋上去了也会完全失去响应式。而到了 <code>created</code> 阶段响应式数据已准备就绪，可以安全、合规地进行赋值。'
                            },
                            {
                                q: '1.3 在created中如何获取dom？',
                                a: '正常情况下 <code>created</code> 时期模板还没有开始编译，真实的 DOM 自然也没有渲染出来。如果业务要求非要在此时获取 DOM，<strong>必须把操作代码包裹在 <code>this.$nextTick(callback)</code> 中。</strong><br>Vue 会把这个回调任务推迟到下一次 DOM 更新循环彻底结束后再执行，那个时候就能安全拿到 DOM 节点了。'
                            },
                            {
                                q: '1.4 一旦进入组件会执行哪些生命周期？',
                                a: '如果是首次进入一个普通的 Vue 组件（即没有被 keep-alive 缓存的组件），会严格按顺序依次执行四个生命周期钩子：<br><strong><code>beforeCreate</code> ➔ <code>created</code> ➔ <code>beforeMount</code> ➔ <code>mounted</code></strong>。'
                            },
                            {
                                q: '1.5 第二次或者第N次进去组件会执行哪些生命周期？',
                                a: '这取决于组件有没有被 <code>&lt;keep-alive&gt;</code> 缓存包裹起来。<br>1. <strong>如果没有被缓存：</strong>每次进入都等同于销毁后重新创建，依然会老老实实走一遍 <code>beforeCreate</code> 到 <code>mounted</code>。<br>2. <strong>如果被缓存了：</strong>组件状态保留在内存中，第 2 到 N 次进入<strong>只会执行 <code>activated</code> 钩子</strong>，绝对不会再去触发初始化的那几个生命周期。'
                            },
                            {
                                q: '1.6 父组件引入子组件，那么生命周期执行的顺序是？',
                                a: '这个执行顺序的核心规律是<strong>“父组件先开始创建，子组件先完成挂载”</strong>。<br>完整的执行流程为：<br>父 <code>beforeCreate</code> ➔ 父 <code>created</code> ➔ 父 <code>beforeMount</code><br>➔ 子 <code>beforeCreate</code> ➔ 子 <code>created</code> ➔ 子 <code>beforeMount</code> ➔ <strong>子 <code>mounted</code></strong><br>➔ <strong>父 <code>mounted</code></strong>。<br>因为父组件必须等内部包含的子组件真实 DOM 全部挂载完毕后，自己才能算作整体挂载完成。'
                            },
                            {
                                q: '1.7 加入keep-alive会执行哪些生命周期？',
                                a: '被 <code>&lt;keep-alive&gt;</code> 缓存的组件会多出两个专属的生命周期：<strong><code>activated</code>（激活时）</strong>和 <strong><code>deactivated</code>（失活/切走时）</strong>。<br>首次进入时：<code>created</code> ➔ <code>mounted</code> ➔ <strong><code>activated</code></strong>。<br>之后再进入：只触发 <strong><code>activated</code></strong>。<br>离开组件时：触发 <strong><code>deactivated</code></strong>，此时组件处于休眠状态，绝对不会触发 <code>beforeDestroy/destroyed</code> 等销毁钩子。'
                            },

                                q: '14.5 浏览器是如何渲染页面的？',
                                a: '<strong>核心思想：</strong> 将 HTML/CSS 字符串文本，转换为屏幕上绘制像素点的全过程（也就是关键渲染路径 CRP）。<br><br><strong>详细流程解析：</strong><br>1. <strong>解析 HTML (Parse HTML)：</strong> 浏览器拿到 HTML，自上而下将其解析成一个树状结构的数据模型，也就是 <strong>DOM 树</strong>。<br>2. <strong>解析 CSS (Parse CSS)：</strong> 遇到 CSS 资源，下载并解析成 <strong>CSSOM 树</strong>（CSS对象模型）。<br>3. <strong>生成渲染树 (Render Tree)：</strong> 浏览器将 DOM 树和 CSSOM 树合并。注意，渲染树只包含页面上<strong>最终要显示</strong>的节点（<code>display: none</code> 的节点会被直接剔除）。<br>4. <strong>计算布局 (Layout / 回流重排)：</strong> 根据渲染树，计算出每一个节点在屏幕上的确切位置和几何尺寸（宽、高、坐标）。<br>5. <strong>绘制 (Paint / 重绘)：</strong> 遍历渲染树，调用系统的绘图 API，把每个节点的颜色、背景、边框、阴影等视觉属性画出来。<br>6. <strong>合成图层 (Composite)：</strong> 页面往往分为多个复杂的图层（比如用了 <code>transform</code> 或 <code>z-index</code> 的元素），浏览器将这些图层按正确的层叠顺序合并到一起，最终显示在屏幕上。<br><br><span class="text-amber-600 text-sm">⚠️ 经验之谈：我们在做性能优化时，应尽量避免频繁修改宽/高等引起<strong>回流(Layout)</strong>的操作，多使用 <code>transform</code> 和 <code>opacity</code> 动画，因为它们可以在独立的 GPU 图层中<strong>直接合成(Composite)</strong>，跳过了回流和重绘，性能极高。</span>'
                            }
                        ]
                    }
                ];

                // --- 核心状态 ---
                const activeCategoryId = ref(categories[0].id);
                // 修改点：默认全关闭，不再默认包含索引 0
                const openQuestions = ref([]); 

                // 计算当前选中的普通分类
                const activeCategory = computed(() => {
                    return categories.find(c => c.id === activeCategoryId.value) || categories[0];
                });

                // --- 搜索与随机功能的核心数据转换 ---
                // 将嵌套的题库打平为一维数组，并附带上级分类名字，方便展示来源
                const allQuestions = computed(() => {
                    const flatList = [];
                    categories.forEach(cat => {
                        cat.questions.forEach(q => {
                            flatList.push({ ...q, catName: cat.name });
                        });
                    });
                    return flatList;
                });

                // --- 全局搜索逻辑 ---
                const searchQuery = ref('');
                const searchResults = computed(() => {
                    const query = searchQuery.value.trim().toLowerCase();
                    if (!query) return [];
                    return allQuestions.value.filter(item => 
                        item.q.toLowerCase().includes(query) || 
                        item.a.toLowerCase().includes(query)
                    );
                });

                // --- 随机测验逻辑 ---
                const randomQuestions = ref([]);
                // 洗牌算法：从原数组中随机抽取指定数量的元素
                const generateRandomQuestions = () => {
                    // 深拷贝一份总题库，避免修改原数组
                    let array = [...allQuestions.value];
                    let currentIndex = array.length, randomIndex;
                    
                    // Fisher-Yates (费雪耶兹) 随机洗牌算法
                    while (currentIndex != 0) {
                        randomIndex = Math.floor(Math.random() * currentIndex);
                        currentIndex--;
                        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                    }
                    
                    // 取前 10 个作为随机题目
                    randomQuestions.value = array.slice(0, 10);
                    // 修改点：抽取后默认全部关闭
                    openQuestions.value = [];
                };

                // --- 返回最顶部逻辑 ---
                const showBackToTop = ref(false);

                const handleScroll = () => {
                    // 当页面向下滚动超过 300px 时显示悬浮按钮
                    showBackToTop.value = window.scrollY > 300;
                };

                const scrollToTop = () => {
                    // 平滑滚动回页面顶部
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                };

                // --- 监听与副作用 ---
                onMounted(() => {
                    // 挂载时添加滚动监听
                    window.addEventListener('scroll', handleScroll);
                });

                onUnmounted(() => {
                    // 卸载时移除监听，防内存泄漏
                    window.removeEventListener('scroll', handleScroll);
                });

                // 监听分类/视图切换
                watch(activeCategoryId, (newVal) => {
                    // 修改点：切换任何视图时，重置折叠状态为全关闭
                    openQuestions.value = []; 
                    
                    // 如果切换到了搜索，自动清空之前的搜索记录
                    if (newVal === 'search') {
                        searchQuery.value = '';
                    }
                    
                    // 如果切换到了随机测验，且当前还没有生成过题目，则自动生成一次
                    if (newVal === 'random' && randomQuestions.value.length === 0) {
                        generateRandomQuestions();
                    }
                });

                // 切换折叠状态
                const toggleQuestion = (index) => {
                    const pos = openQuestions.value.indexOf(index);
                    if (pos > -1) {
                        openQuestions.value.splice(pos, 1);
                    } else {
                        openQuestions.value.push(index); 
                    }
                };

                return {
                    categories,
                    activeCategoryId,
                    activeCategory,
                    openQuestions,
                    toggleQuestion,
                    // 搜索抛出
                    searchQuery,
                    searchResults,
                    // 随机抛出
                    randomQuestions,
                    generateRandomQuestions,
                    // 返回顶部抛出
                    showBackToTop,
                    scrollToTop
                };
            }
        });

        app.mount('#app');
    </script>
